# spokenpad configuration
#
# Copy this file to ~/.config/spokenpad/config.toml and keep only the lines
# you change: every key is optional and shown here at its default. An unknown
# key is an error, so a typo cannot pass silently. Every duration is in
# seconds. Why each default is what it is: docs/configuration.md.
#
# A running daemon reads this file again for each new dictation window:
# [nvim] applies there. Every other section needs
# `systemctl --user restart spokenpad`. `spokenpad check` validates the file.
#
# Keys are bound in your window manager, not here: see "Bind your keys" in
# the README.

[audio]
# Must be 16000: the models read 16 kHz.
sample_rate = 16000

# Audio kept from before the key goes down, so the first word is not
# clipped. 0 closes the microphone between presses.
preroll_seconds = 0.25

# Audio still captured after the key comes up, for the word still sounding.
# At most 1.
postroll_seconds = 0.25

# The input device, as words matched against PortAudio's device names.
# Left out, the default input device.
# device = "USB ALSA"

[capture]
# A latched capture (`spokenpad toggle`) that hears no speech this long ends
# by itself, keeping everything said. 0 turns it off. Raise it if you pause
# longer while you think.
silence_timeout_seconds = 300

[recording]
# Write every capture to a WAV while you speak: the safety net that
# `spokenpad transcribe` recovers from. Keep it on.
enabled = true

# Where the WAVs go, by default under $XDG_STATE_HOME. Give it a directory
# of its own: spokenpad prunes it.
# dir = "~/.local/state/spokenpad/audio"

# Space the WAVs may take before the oldest are pruned: 5 GiB, about 46 hours.
max_total_bytes = 5368709120

[asr]
# The speech model: a NeMo transducer. The default is Parakeet TDT 0.6B v3,
# which spokenpad downloads on first use to $XDG_DATA_HOME/spokenpad/models.
# Set it only to use another model; a set path is never downloaded to.
# model_dir = "~/.local/share/spokenpad/models/parakeet-tdt-0.6b-v3-int8"

# CPU threads per decode.
num_threads = 6

# "greedy_search", or "modified_beam_search", which vocabulary needs. Beam
# search on Parakeet TDT sometimes drops a sentence; leave it out.
# decoding = "greedy_search"

# Words the decoder should favour, such as project names it mishears.
# Setting it switches to beam search.
# vocabulary = ["kubectl", "spokenpad", "nginx"]

# How strongly each vocabulary phrase is favoured. Above about 3 it rewrites
# ordinary words.
# hotwords_score = 1.5

[vad]
# The voice activity detector: it decides what is speech and cuts it into
# chunks that are decoded while you speak. It is always on.

# The detector's weights, downloaded with the speech model.
# model = "~/.local/share/spokenpad/models/silero_vad.onnx"

# How sure the detector must be that a frame is speech. Lower it if a quiet
# voice is dropped; raise it if room noise is transcribed.
threshold = 0.5

# Silence that ends a run of speech. Lower cuts sentences at every breath.
min_silence_seconds = 0.35

# The shortest run that counts as speech, so a cough does not.
min_speech_seconds = 0.15

# The longest run before the detector cuts it; nothing is lost at the cut.
max_speech_seconds = 20.0

# Speech gathered into one chunk before it is decoded. Lower gives text
# sooner and costs accuracy.
chunk_seconds = 10.0

# Audio kept around a chunk, and around the first and last chunk of a capture.
pad_seconds = 0.5
edge_pad_seconds = 2.0

[text]
# Remove filler words, as whole words, ignoring case.
strip_fillers = true
fillers = ["uh", "um", "erm", "hmm"]

# Exact, whole-word, case-sensitive replacements, in the order written.
# replacements = { teh = "the" }
replacements = {}

# Add a space after each transcript.
trailing_space = false

[nvim]
# "pane": spokenpad opens its own window, which never takes the focus (X11,
# or Wayland through Xwayland). "attach": you run `spokenpad editor` in a
# terminal, on any desktop.
mode = "pane"

# The Neovim command.
editor = ["nvim"]

# Neovim's configuration: left out, your own. "bundled" opens the window
# about 3.5x faster; pair it with colorscheme. "NONE", or a path, also work.
# init = "bundled"

# A colourscheme to load, for example with init = "bundled".
# colorscheme = "tokyonight-moon"

# Let the terminal's background show through the colourscheme's.
transparent = true

# Pane mode: the window's size in character cells, as Alacritty's
# window.dimensions, cut to what fits on the monitor.
pane_dimensions = { columns = 72, lines = 20 }

# Pane mode: "floating" above your windows beside the pointer, or "tiled"
# beside your window on i3 and sway.
pane_layout = "floating"

# Pane mode: the font, as a fontconfig family name, and its size in points,
# as Alacritty's font.size (scaled by the X resource Xft.dpi).
font_family = "monospace"
font_size = 11.25

# Where Neovim listens for the daemon.
# socket_path = "$XDG_RUNTIME_DIR/spokenpad-nvim.sock"

# The dictation files: one per editor, named by this strftime template. Keep
# a time in it, or two sessions in one day share a file. The directory
# defaults to $XDG_STATE_HOME/spokenpad/dictation.
# dictation_dir = "~/.local/state/spokenpad/dictation"
file_template = "dictation-%Y-%m-%d-%H%M%S.md"

# How long a new window's Neovim may take to start. Raise it if your
# configuration installs plugins on first start.
startup_timeout_seconds = 20.0

# A desktop notification when text goes to a file because no window is open.
notify = true

# After each release, copy the whole dictation buffer to the clipboard.
copy_to_clipboard = false

[preview]
# How often, while you speak, finished chunks are committed and the sentence
# you are in is previewed. At least 0.2.
interval_seconds = 1.1

# The longest unfinished tail that is previewed; past it the preview pauses
# while text keeps landing, exactly as it would have.
max_seconds = 30.0
