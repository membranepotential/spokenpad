# voice-kb configuration
#
# Every key below is shown at its default value. Copy this file to
# ~/.config/voice-kb/config.toml and uncomment/edit only what you need to
# change -- an absent section or key falls back to its default, but an
# *unknown* section or key is a hard error (config.py rejects typos loudly
# rather than silently ignoring them).

[hotkey]
# evdev key code for push-to-talk. 186 is KEY_F16 -- the Keychron Q10 Pro's
# M4 key. This is the evdev code, not the X11 keycode (which is this + 8).
key_code = 186

# evdev key code that cancels an in-progress recording/transcription.
# 1 is KEY_ESC. Set to a bare integer to change it, or comment out /
# omit for the default -- there is no way to disable it from TOML since
# `null` isn't a code, only Python's None is (leave this line out and pass
# cancel_key_code=None in code if you need it disabled).
cancel_key_code = 1

# Modifier that turns a press into a LATCHED recording: hold it together with
# the hotkey and recording runs until the hotkey is pressed again, instead of
# ending when you let go. For a long passage, holding a key for two minutes is
# its own kind of friction.
#
# The press that STOPS a latched recording does not need the modifier -- so you
# never have to remember which hand you started with. The nvim winbar shows a
# lock while latched, since the way to stop it differs from push-to-talk.
#
# One of "shift", "ctrl", "alt". Omit the line entirely to disable latching and
# leave pure push-to-talk (there is no way to write None in TOML).
latch_modifier = "shift"

[audio]
# Parakeet expects 16 kHz input. Changing this requires a matching model.
sample_rate = 16000

# Audio retained before the key goes down, so the first word isn't clipped.
# This costs an always-open input stream -- the mic stays live the whole
# time voice-kb runs. Set to 0 to disable pre-roll; the stream is then
# opened lazily on keypress instead, at the cost of clipping quick starts.
preroll_ms = 250

# PipeWire/PulseAudio source name. Omit (or leave unset) to use the default
# input device.
# device = "alsa_input.usb-..."

[asr]
# Path to the model directory. Relative paths resolve against the config
# file's own directory, not the current working directory, so this file
# can be edited from anywhere.
model_dir = "models/parakeet-tdt-0.6b-v3-int8"

# CPU threads for decoding.
num_threads = 6

# "greedy_search" (faster, no hotword biasing) or "modified_beam_search"
# (slightly slower, required for `vocabulary` below).
decoding = "modified_beam_search"

# Per-token bias applied to each word in `vocabulary`. Measured on this
# model: 1.5 fixes "mkir" -> "mkdir"; above ~3.0 it starts firing on
# unrelated audio; 6.0 rewrites ordinary words. Raise with care and re-run
# scripts/eval.py after any change.
hotwords_score = 1.5

# Words and phrases to bias the decoder toward, e.g. project names or
# commands that are otherwise misheard. Only takes effect with
# decoding = "modified_beam_search"; greedy decoding ignores it.
# vocabulary = ["kubectl", "voice-kb", "nginx"]
vocabulary = []

[vad]
# Voice activity detection. The capture is split at silence and each speech
# segment decoded in turn, in one pass -- no region is ever decoded twice.
#
# This is a CORRECTNESS setting before it is anything else. Parakeet returns
# an EMPTY STRING when speech is a small fraction of the window it is given:
# the same 0.53s of speech decodes to "D home." with no padding, "Did the
# home?" with 2s of silence each side, and "" with 5s. In use that is pressing
# the key, saying two words, and getting nothing back. Turning this off
# restores the old whole-buffer behaviour, that bug included.
#
# It does NOT make decoding faster -- measured 12.3-12.6x real-time whole-buffer
# against 11.0-11.7x segmented. What it changes is when text starts appearing:
# 0.3-0.5s instead of 2-3s, then streaming in behind that.
enabled = true

# Silero VAD weights, ~2 MB, fetched by scripts/fetch_model.py. Relative paths
# resolve against this file's directory. If the file is missing, voice-kb logs
# a warning and decodes whole captures rather than refusing to start.
model = "models/silero_vad.onnx"

# Speech probability above which a frame counts as speech.
threshold = 0.5

# Silence needed to end a segment -- the sentence-boundary knob. Too low and a
# sentence is chopped at every breath, which costs quality: the recogniser
# capitalises each segment as a fresh start, so mid-sentence splits leave
# stray capitals. Too high and segments grow until delivery stops feeling
# incremental.
min_silence_seconds = 0.35

# Shortest run that counts as speech, so a cough does not become a segment.
min_speech_seconds = 0.15

# Hard cap on a single segment, cutting it even mid-sentence. Nothing is lost
# -- the audio continues in the next segment -- and this is what bounds time
# to first text when someone talks without pausing.
max_speech_seconds = 20.0

[text]
# Strip standalone filler words (see `fillers` below) from the transcript.
strip_fillers = true

# Removed only as whole words, case-insensitively, never as substrings of
# another word ("um" won't touch "umbrella").
fillers = ["uh", "um", "erm", "hmm"]

# Exact, whole-word, case-sensitive substitutions applied after decoding.
# Deliberately NOT fuzzy: the tool this project replaced used edit-distance
# matching and turned "set" into "sed" and "reset" into "rust". Prefer
# asr.vocabulary above for fixing misheard technical terms -- biasing what
# the decoder hears beats rewriting what it already got wrong.
# replacements = { teh = "the" }
replacements = {}

# Append a trailing space to the injected text, useful if you always type
# a word immediately after dictating.
trailing_space = false

[nvim]
# nvim config for the dictation window. Commented out means the one bundled
# with voice-kb (src/voice_kb/dictation_init.lua): chrome off before the first
# frame is drawn, prose wrapping on, no swap/backup/undo files, and no
# format-on-save that could reflow a transcript. It also keeps the window's
# behaviour inside this repo rather than depending on your dotfiles.
#
# Point it at your own config to get your keybindings and colourscheme in the
# window instead -- at the cost of both of those guarantees. "NONE" is nvim's
# own special value for no config at all.
# init = "~/.config/nvim/init.lua"
# Where the transcript goes: a floating neovim window, appended to over its
# msgpack-RPC socket. Nothing is ever pasted into the window you are working
# in, and no keystrokes are synthesised anywhere -- see docs/constraints.md.

# The terminal to run the editor in, with the editor's own argv appended.
# The literal token {instance} is replaced with `window_instance` below.
#
# The default asks alacritty for X11 class "Floating" and instance
# "voice-kb", which is what the window manager rules key on. Set to [] to run
# `editor` directly, for a GUI editor that needs no terminal.
terminal = ["alacritty", "--class", "Floating,{instance}", "-e"]

# The editor. `--listen <socket>` and the dictation file are appended to
# this, so anything here comes first: ["nvim", "-u", "NONE"] gets an editor
# with none of your own config loaded.
editor = ["nvim"]

# X11 instance name of the dictation window. It must match whatever your
# window manager rules match on. voice-kb writes the i3 rules to
# ~/.config/i3/i3.d/voice-kb.conf; see docs/nvim-window.md.
#
# Restricted to [A-Za-z0-9_-] because it is interpolated into an i3 criteria
# string, and a config value must not be able to become i3 syntax.
window_instance = "voice-kb"

# Size of the dictation window, as a fraction of each screen axis: 0.33 is a
# third of the width and a third of the height. It opens with its top-left
# corner at the mouse pointer, clamped fully on screen, so it lands beside
# whatever you are reading rather than in a fixed corner.
window_fraction = 0.33

# Where nvim listens for RPC. voice-kb reattaches to a live socket rather
# than opening a second window, so restarting the daemon does not litter the
# desktop with terminals.
#
# Defaults to $XDG_RUNTIME_DIR/voice-kb-nvim.sock, falling back to the state
# directory below if that variable is unset. Both ~ and $VAR are expanded
# here -- but a $VAR that is not actually set is a hard error rather than a
# literal directory named "$XDG_RUNTIME_DIR" in your home.
socket_path = "/run/user/1000/voice-kb-nvim.sock"

# Directory holding the dictation files, and the strftime template for their
# names -- one file per WINDOW, saved after every single utterance.
#
# Closing the dictation window ends the passage: the next time you record,
# voice-kb opens a new window on a new file rather than appending under
# everything you said an hour ago. While the window stays open every utterance
# goes into it, across a daemon restart included. Include a time in the
# template, not just a date, or two sessions in one day share a page.
#
# A real file rather than a scratch buffer, deliberately: a transcript that
# disappears because a buffer was closed is the same class of failure as one
# dropped by a streaming decoder, which is the failure this project exists to
# eliminate.
# dictation_dir defaults to $XDG_STATE_HOME/voice-kb/dictation, and to
# ~/.local/state/voice-kb/dictation when XDG_STATE_HOME is unset.
dictation_dir = "~/.local/state/voice-kb/dictation"
file_template = "dictation-%Y-%m-%d-%H%M%S.md"

# How long to wait for a freshly spawned nvim to start listening.
startup_timeout_s = 5.0

[preview]
# The rolling preview of the transcript, shown while the key is held.
#
# Cosmetic only. The text that actually gets committed is still produced by
# exactly ONE decode of the complete captured buffer at key release -- a
# preview is never appended, never merged into the final text, and never
# influences it (see docs/constraints.md). In nvim it is not even buffer
# content: it is an extmark's virtual text, so it cannot be saved, yanked, or
# undone into the file.
enabled = true

# How often a preview decode is requested while recording. Must be >= 200.
interval_ms = 1100

# Stop previewing once the utterance is longer than this many seconds.
#
# Each preview decodes the WHOLE utterance so far, from its start. That is what
# keeps words on screen once they appear. A trailing window was tried first and
# it was wrong: it physically discarded the beginning of the sentence, so text
# vanished in chunks while you were still speaking.
#
# Decoding from the start means cost grows with the utterance, and two things
# bound it. The gap between previews is max(interval - last_decode,
# last_decode), so the worker stays idle at least half the time; and past this
# many seconds previews simply stop. Nothing disappears when they do -- the
# last one stays on screen.
#
# This is a latency budget. A preview still QUEUED when you release the key is
# dropped, but one already decoding cannot be interrupted, so the real decode
# waits behind it. At ~14.6x real-time, 30s of audio costs ~2.0s -- that is the
# worst a release can pay, ~1.0s expected. Raising this raises both in
# proportion. When previews do stop, the nvim winbar says so.
max_seconds = 30.0

[overlay]
# Show the Qt status overlay at all.
#
# Off by default since the sink became nvim: the dictation window carries the
# same indicator (phase, level meter, live preview) in its winbar, rendered
# where the text is about to land instead of in a second widget elsewhere on
# screen. Turn it back on if you want feedback before the dictation window
# has finished opening. It still never takes focus.
enabled = false

# Width of the pill, and the height of its status row (dot, label, level
# meter). With previews enabled the widget is height + preview_height tall.
# Sizes are in Qt's LOGICAL pixels, not device pixels. On a HiDPI display
# (Xft.dpi 192 gives a device pixel ratio of 2.0) the overlay is drawn twice
# this size in real pixels, so it stays the same apparent size as it would on
# a 96dpi screen rather than shrinking to a sliver on a 4K panel.
width = 720
height = 96

# Gap between the overlay and the bottom edge of the output it's shown on.
margin_px = 32

# Place the overlay on the output holding the currently focused window,
# rather than always on the primary output.
follow_focus = true

# Extra pixels below the status row for the preview text (two lines, with
# the oldest words elided away first). Ignored when preview.enabled = false.
preview_height = 64
