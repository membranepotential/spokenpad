# spokenpad configuration
#
# Every key below is shown at its default value. Copy this file to
# ~/.config/spokenpad/config.toml and uncomment/edit only what you need to
# change -- an absent section or key falls back to its default, but an
# *unknown* section or key is a hard error (config.rs rejects typos loudly
# rather than silently ignoring them).

[hotkey]
# evdev key code for push-to-talk. 186 is KEY_F16 -- the Keychron Q10 Pro's
# M4 key. This is the evdev code, not the X11 keycode (which is this + 8).
key_code = 186

# evdev key code that discards a recording in progress. 1 is KEY_ESC. Set to a
# bare integer to change it, or comment out / omit for the default. TOML has no
# null value, so this option cannot be disabled from the configuration file.
#
# It cancels ONLY while recording. Once the key is released the audio is already
# captured and the final decode is about to land, so a cancel is ignored from
# there on -- this key is read from every keyboard regardless of focus, and
# honouring it then would destroy a finished dictation. Cancelling never unwrites
# text that already reached the file: it stops further decoding, and the
# recovery WAV is kept.
#
# A press held for less than 120 ms is a stray tap, not dictation: the capture is
# discarded and the winbar says "held too briefly". That threshold is a property
# of how a key feels rather than of a deployment, so it is a constant in
# state.rs, not a setting. Losing the keyboard that holds the hotkey (or the last
# hotkey-capable keyboard during a latched recording) ends the recording by
# decoding what was said rather than throwing it away.
cancel_key_code = 1

# Modifier that turns a press into a LATCHED recording: hold it together with
# the hotkey and recording runs until the hotkey is pressed again, instead of
# ending when you let go. For a long passage, holding a key for two minutes is
# its own kind of friction.
#
# The press that STOPS a latched recording does not need the modifier -- so you
# never have to remember which hand you started with. The nvim winbar shows a
# lock while latched, since the way to stop it differs from push-to-talk.
#
# One of "shift", "ctrl", "alt", "super", or "none". Use "none" to disable
# latching; omitting the line retains the default "shift".
latch_modifier = "shift"

[audio]
# Must be 16000. Silero's VAD window is 512 samples at 16 kHz and Parakeet's
# feature extractor assumes the same rate; nothing resamples in between, so
# any other value is rejected at startup rather than silently degrading.
sample_rate = 16000

# Audio retained before the key goes down, so the first word isn't clipped.
# This costs an always-open input stream -- the mic stays live the whole
# time spokenpad runs. Set to 0 to disable pre-roll; the stream is then
# opened lazily on keypress instead, at the cost of clipping quick starts.
preroll_ms = 250

# Audio still captured after the key comes up, because the last syllable is
# often still sounding at that moment: without it the final word is clipped.
# The release waits this long (plus up to 100 ms for the device) before it
# decodes; pressing the key again ends the wait at once, so a quick re-press
# never loses its first word to the previous capture. Discards (a tap held too
# briefly, the cancel key) take no post-roll. 0 to disable; at most 1000.
postroll_ms = 250

# PortAudio device-name query: case-insensitive, ordered words matched against
# the device name and host API. Omit to use the default input device.
# device = "USB ALSA"

[recording]
# Every capture is written to a wav while you are speaking, independently of
# decoding. This is the safety net, and it is ON by default: an opt-in one is
# switched off exactly when it turns out to have been needed.
#
# On 2026-09-08 a 13m41s hold hit the in-memory ceiling, the audio past it was
# dropped inside the realtime callback -- the only copy that existed -- and
# 3m41s of dictation was gone, with nothing in the log to say so. With a
# recording, a decode that fails, is cancelled, or stops short is no longer a
# loss: `spokenpad transcribe <wav>` decodes the file through the same VAD and
# model the daemon uses and prints the transcript.
#
# The cost is ~32 KB per second of speech (16 kHz 16-bit mono), pruned below.
#
# The in-memory ceiling that incident hit is 3600 seconds (MAX_UTTERANCE_SECONDS
# in audio.rs), a compile-time constant rather than a setting: it is a bound on
# how much a capture may occupy of this machine's RAM (~230 MB/hour at 16 kHz),
# not a policy. Reaching it now says so in the winbar and names the WAV that
# keeps recording past it; the recovery file is written before the ceiling is
# consulted, so the cap can never truncate it.
enabled = true

# Where the recordings go. Created mode 0700, each file mode 0600 -- a capture
# holds whatever you dictated, which is why the log file is 0600 too.
# Defaults to $XDG_STATE_HOME/spokenpad/audio (~/.local/state/spokenpad/audio).
# ~ and $VAR are expanded; an unset $VAR is an error rather than a literal
# directory named after it.
#
# GIVE THIS A DIRECTORY OF ITS OWN: spokenpad prunes it (see max_total_bytes
# below). Only the `capture-*.wav` files it writes are ever deleted -- nothing
# else in the directory is touched -- but a folder that is only ever spokenpad's
# leaves no room for that promise to be wrong.
# dir = "~/.local/state/spokenpad/audio"

# Size budget for that directory, enforced oldest-first at startup and once
# per capture. 5 GiB is ~46 hours of speech. Age is deliberately not a
# criterion: a recording is pruned because something newer needs the space,
# never because it got old. The capture being written is never pruned.
max_total_bytes = 5368709120

[asr]
# Path to the model directory. A path set HERE resolves against the config
# file's own directory, not the current working directory, so this file can be
# edited from anywhere. Leaving the key out keeps the built-in default, which
# stays relative to the working directory -- which is why the systemd unit sets
# WorkingDirectory to the checkout.
model_dir = "models/parakeet-tdt-0.6b-v3-int8"

# CPU threads for decoding.
num_threads = 6

# "greedy_search" (faster, no hotword biasing) or "modified_beam_search"
# (slightly slower, required for `vocabulary` below).
decoding = "modified_beam_search"

# Per-token bias applied to each word in `vocabulary`. Measured on this
# model: 1.5 fixes "mkir" -> "mkdir"; above ~3.0 it starts firing on
# unrelated audio; 6.0 rewrites ordinary words. Raise with care and re-run
# scripts/eval.py after any change.
hotwords_score = 1.5

# Words and phrases to bias the decoder toward, e.g. project names or
# commands that are otherwise misheard. Only takes effect with
# decoding = "modified_beam_search"; greedy decoding ignores it.
# vocabulary = ["kubectl", "spokenpad", "nginx"]
vocabulary = []

[vad]
# Voice activity detection. The capture is split at silence and each speech
# segment decoded in turn, in one pass -- no region is ever decoded twice.
#
# This is a CORRECTNESS setting before it is anything else. Parakeet returns
# an EMPTY STRING when speech is a small fraction of the window it is given:
# the same 0.53s of speech decodes to "D home." with no padding, "Did the
# home?" with 2s of silence each side, and "" with 5s. In use that is pressing
# the key, saying two words, and getting nothing back. Turning this off
# restores the old whole-buffer behaviour, that bug included.
#
# A chunk this finds speech in that still decodes to an empty string is
# decoded once more without the second of trailing silence the recogniser
# normally appends; some short utterances only come back that way. Without
# the detector nothing is known to be speech, so nothing is retried.
#
# It does NOT make decoding faster -- measured 12.3-12.6x real-time whole-buffer
# against 11.0-11.7x segmented. What it changes is WHEN text appears: the first
# chunk lands after ~1s instead of after the whole recording, so a five-minute
# latched passage starts arriving immediately rather than all at once at the
# end. Accuracy costs a little on the five reference clips: 17.6% aggregate WER
# through `uv run scripts/eval.py --vad` against 13.9% whole-buffer (Handy 0.9.6
# scores 48.7% on the same five). See docs/rust.md.
#
# It also decides what NOT to decode: a capture this finds no speech in is not
# handed to the recogniser at all. Silence does not decode to an empty string,
# it decodes to invented words -- an empty half-second press came back "Thank
# you." and the words landed in the file. With this off, every capture is
# decoded whole, silence included.
enabled = true

# Silero VAD weights, ~2 MB, fetched by scripts/fetch_model.py. Relative paths
# resolve against this file's directory. If the file is missing, spokenpad logs
# a warning and decodes whole captures rather than refusing to start.
model = "models/silero_vad.onnx"

# Speech probability above which a frame counts as speech. This is also the
# knob for the silence rule above: what the detector misses entirely is never
# decoded, so lower it if a quiet voice or a distant microphone is being
# dropped, and raise it if room noise is being transcribed.
threshold = 0.5

# Silence needed to end a segment -- the sentence-boundary knob. Too low and a
# sentence is chopped at every breath, which costs quality: the recogniser
# capitalises each segment as a fresh start, so mid-sentence splits leave
# stray capitals. Too high and segments grow until delivery stops feeling
# incremental.
min_silence_seconds = 0.35

# Shortest run that counts as speech, so a cough does not become a segment.
min_speech_seconds = 0.15

# Hard cap on a single detected run of speech, cutting it even mid-sentence.
# Nothing is lost -- the audio continues in the next one.
max_speech_seconds = 20.0

# Speech to accumulate before closing a chunk and decoding it. Detected runs
# are MERGED up to this, because a boundary costs accuracy -- the model sees no
# context across one. Measured: decoding every run separately scored 37.7% WER
# against 33.7% for the whole buffer, while merging to 10s scored 33.4%.
# Lower it for text sooner at some cost in accuracy, and re-run
# `uv run scripts/eval.py --vad` if you do.
chunk_seconds = 10.0

# Real audio kept either side of a chunk, beyond what the detector marked.
# Silero's boundaries clip word onsets and endings; 0.5s beat 0.2s by 2-4 WER
# points at every chunk size tried.
pad_seconds = 0.5

# A wider margin before the FIRST chunk and after the LAST one. The edges of a
# capture are where losing audio costs something: a word clipped off the front
# is the first word of the sentence, while one trimmed from the middle of a
# pause is nobody's loss. Applies only to chunks that already hold 3s of
# speech, so a brief utterance in a quiet capture keeps its tight trim -- a
# chunk swamped by silence is exactly what makes the recogniser return
# nothing, which is the bug this whole section exists to prevent.
edge_pad_seconds = 2.0

[text]
# Strip standalone filler words (see `fillers` below) from the transcript.
strip_fillers = true

# Removed only as whole words, case-insensitively, never as substrings of
# another word ("um" won't touch "umbrella").
fillers = ["uh", "um", "erm", "hmm"]

# Exact, whole-word, case-sensitive substitutions applied after decoding.
# Deliberately NOT fuzzy: the tool this project replaced used edit-distance
# matching and turned "set" into "sed" and "reset" into "rust". Prefer
# asr.vocabulary above for fixing misheard technical terms -- biasing what
# the decoder hears beats rewriting what it already got wrong.
# replacements = { teh = "the" }
replacements = {}

# Append a trailing space to the injected text, useful if you always type
# a word immediately after dictating.
trailing_space = false

[nvim]
# nvim config for the dictation window.
#
#   unset       your own ~/.config/nvim -- everything you have, and its cost
#   "bundled"   spokenpad's own: no plugins, chrome off before the first frame
#   "NONE"      a bare nvim
#   <a path>    that file
#
# Measured on a full LazyVim setup, key-down to a placed window answering RPC:
# 0.73s unset against 0.21s bundled. The window is for watching a transcript
# land rather than for editing, so a whole plugin set is startup cost with
# little to show for it -- and the two things it did show for it survive
# `bundled`: the yank flash is built into nvim, and `colorscheme` below loads
# a theme without the configuration it normally lives in (0.23s with one).
#
# spokenpad strips the chrome and sets prose wrapping over RPC whatever is
# loaded, and writes committed text with `noautocmd` so a format-on-save
# cannot reflow a transcript.
# init = "bundled"

# Colourscheme for the window. With init = "bundled" this is what still makes
# it look like your editor: only the one plugin directory providing the named
# scheme is put on the runtimepath, so the colours arrive without the startup
# cost of everything around them. Harmless with a full config, where it just
# switches theme.
# colorscheme = "tokyonight-moon"

# Let the terminal's background show through. On by default, and it is what
# makes `colorscheme` above look right: a theme loaded straight from its plugin
# directory is the theme's DEFAULTS, not the theme as you configured it, so one
# you run with `transparent = true` arrives opaque here and paints a block of
# its own background inside your terminal's border. Set false to take the
# colourscheme's own background instead.
# transparent = true
# Where the transcript goes: a floating neovim window, appended to over its
# msgpack-RPC socket. Nothing is ever pasted into the window you are working
# in, and no keystrokes are synthesised anywhere -- see docs/constraints.md.

# The terminal to run the editor in, with the editor's own argv appended.
# The literal token {instance} is replaced with `window_instance` below.
#
# The default asks alacritty for X11 class "Floating" and instance
# "spokenpad", which is what the window manager rules key on. Rust refuses
# graphical commands whose instance setting it cannot verify. Set to [] only
# with an explicitly headless editor (for example ["nvim", "--headless"]).
terminal = ["alacritty", "--class", "Floating,{instance}", "-o", "window.position.x={x}", "-o", "window.position.y={y}", "-e"]

# The editor. `--listen <socket>` and the dictation file are appended to
# this, so anything here comes first: ["nvim", "-u", "NONE"] gets an editor
# with none of your own config loaded.
editor = ["nvim"]

# X11 instance name of the dictation window. It must match whatever your
# window manager rules match on. spokenpad writes the i3 rules to
# ~/.config/i3/i3.d/spokenpad.conf; see docs/nvim-window.md.
#
# Restricted to [A-Za-z0-9_-] because it is interpolated into an i3 criteria
# string, and a config value must not be able to become i3 syntax.
window_instance = "spokenpad"

# Size of the dictation window, as a fraction of each screen axis: 0.33 is a
# third of the width and a third of the height. It opens with its top-left
# corner at the mouse pointer, clamped fully on screen, so it lands beside
# whatever you are reading rather than in a fixed corner.
window_fraction = 0.33

# Where nvim listens for RPC. spokenpad reattaches to a live socket rather
# than opening a second window, so restarting the daemon does not litter the
# desktop with terminals.
#
# Defaults to $XDG_RUNTIME_DIR/spokenpad-nvim.sock, falling back to the state
# directory below if that variable is unset. Both ~ and $VAR are expanded
# here -- but a $VAR that is not actually set is a hard error rather than a
# literal directory named "$XDG_RUNTIME_DIR" in your home.
# socket_path = "$XDG_RUNTIME_DIR/spokenpad-nvim.sock"

# Directory holding the dictation files, and the strftime template for their
# names -- one file per WINDOW, saved after every single utterance.
#
# Closing the dictation window ends the passage: the next time you record,
# spokenpad opens a new window on a new file rather than appending under
# everything you said an hour ago. While the window stays open every utterance
# goes into it, across a daemon restart included. Include a time in the
# template, not just a date, or two sessions in one day share a page.
#
# A real file rather than a scratch buffer, deliberately: a transcript that
# disappears because a buffer was closed is the same class of failure as one
# dropped by a streaming decoder, which is the failure this project exists to
# eliminate.
# dictation_dir defaults to $XDG_STATE_HOME/spokenpad/dictation, and to
# ~/.local/state/spokenpad/dictation when XDG_STATE_HOME is unset.
dictation_dir = "~/.local/state/spokenpad/dictation"
file_template = "dictation-%Y-%m-%d-%H%M%S.md"

# How long to wait for a freshly spawned nvim to be ready: listening on the
# socket, its ownership nonce set, AND the user's own startup handlers finished.
# Generous on purpose -- a first-ever open took 13.5s while a plugin manager did
# one-time work, and killing a healthy editor mid-startup is the worse failure.
startup_timeout_s = 20.0

[preview]
# The tick of progressive commit (docs/progressive-commit.md): every
# interval_ms while the key is held, the audio since the committed offset is
# split at silence, each chunk that has settled is decoded ONCE and appended
# to the dictation buffer, and the open tail -- the sentence being spoken now
# -- is decoded for the live preview below it.
#
# The preview is cosmetic only: virtual text in nvim, replaced every tick,
# never written to the file. What reaches the buffer is each chunk decoded
# exactly once, when it settles or at key release. Turning this off means
# nothing commits until the key is released, and the whole capture is decoded
# then.
enabled = true

# Minimum time between ticks. Must be >= 200. The real gap is
# max(interval - last_decode, last_decode), so the worker stays idle at least
# half the time however long the passage gets.
interval_ms = 1100

# Backstop on how much uncommitted audio a preview may decode. Without a VAD
# model no preview is issued at all -- the whole growing capture would have to
# be re-decoded, which this project refuses -- so with a VAD model the tick
# only ever decodes the open tail, at most one chunk, and this is reached only
# if a chunk somehow never settles. Past this many seconds previews pause, the
# winbar says so, and they resume by themselves once the tail is short again.
max_seconds = 30.0
