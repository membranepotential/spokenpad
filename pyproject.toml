[project]
name = "spokenpad"
version = "0.2.0"
description = "Offline Python evaluation helpers for spokenpad"
readme = "README.md"
authors = [
    { name = "Felix Peppert", email = "felix@peppert.de" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "sherpa-onnx>=1.13.6",
    "sherpa-onnx-core==1.13.6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src/spokenpad", "scripts", "tests"]
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["sherpa_onnx.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"scripts/spike_*.py" = ["ANN", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
