[project]
name = "voice-kb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Felix Peppert", email = "felix@peppert.de" }
]
requires-python = ">=3.13"
dependencies = [
    "evdev>=2.0.0",
    "numpy>=2.5.2",
    "pyudev>=0.24.4",
    "sherpa-onnx>=1.13.6",
    "sherpa-onnx-core==1.13.6",
    "sounddevice>=0.5.6",
]

[project.scripts]
voice-kb = "voice_kb:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
