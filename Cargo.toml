[package]
name = "spokenpad"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local push-to-talk dictation for Linux"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
hound = "=3.5.1"
indexmap = { version = "2.14", features = ["serde"] }
libc = "0.2"
log = { version = "0.4", features = ["std"] }
portaudio = "=0.8.0"
regex = "1.12"
rmpv = "=1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
# Static: sherpa-onnx and onnxruntime are linked into the one executable, so an
# installed binary needs no library beside it.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }
# Pin the FFI and the safe wrapper together: native config layout is versioned.
sherpa-onnx-sys = { version = "=1.13.8", default-features = false, features = ["static"] }
signal-hook = "0.4"
# The pane's glyphs: hinted rasterising of one grapheme at a time.
swash = "0.2"
tempfile = "3.27"
toml = { version = "0.8", features = ["preserve_order"] }
# The pane's window. `allow-unsafe-code` provides `XCBConnection`, the one
# x11rb connection type xkbcommon's X11 half can read a keymap from, and
# `dl-libxcb` loads libxcb at run time instead of linking it.
x11rb = { version = "0.14", features = ["allow-unsafe-code", "dl-libxcb"] }
# The keyboard layout the X server actually loaded, with dead keys and
# Compose, also loaded at run time. Both of these are `dl`/`dlopen` variants
# on purpose: dictation's default mode opens no window, and a binary that
# listed these libraries as needed would refuse to *start* on a machine
# without them. `shell/pane/xkb.rs` wraps them, and names the missing package
# when `nvim.mode = "pane"` asks for one that is not installed.
xkbcommon-dl = { version = "0.4", features = ["x11"] }
# The only network access anywhere in spokenpad: downloading the pinned
# default model files. rustls, not native-tls/OpenSSL, so the static binary
# links no system TLS library; gzip is off, the default models are already
# compressed binary weights.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Already a runtime dependency; integration tests need it to reap the editor
# process group they spawned.
libc = "0.2"
# The screenshot the pane example and the render test write. A PNG encoder is
# for looking at the result, not for the daemon, so it stays a dev-dependency.
png = "0.18"
# XTEST, to fake a click and a keystroke against the test's own X server.
# spokenpad never synthesises input, so the feature is asked for here and not
# in [dependencies]: it is not compiled into the binary.
x11rb = { version = "0.14", features = ["xtest"] }

[profile.release]
lto = "thin"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
