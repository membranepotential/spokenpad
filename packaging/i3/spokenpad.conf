# spokenpad on i3: example key bindings. No window rule is needed: the pane
# (the default mode) keeps itself unfocused, and attach mode opens no window.
#
# The package installs this as /usr/share/spokenpad/i3/spokenpad.conf and
# does not activate it. Copy the lines you want into your i3 config, or link
# the file into a directory your config includes, for example
#   mkdir -p ~/.config/i3/i3.d
#   ln -s /usr/share/spokenpad/i3/spokenpad.conf ~/.config/i3/i3.d/spokenpad.conf
# with `include i3.d/*.conf` in ~/.config/i3/config (i3 4.20 or newer), then
# `i3-msg reload`.
#
# spokenpad reads no keyboard: these run the commands that control the daemon
# (README, "Bind your keys"). They are commented out because a key bound twice
# is an i3 config error, and your config may bind these keys already. Pause
# talks and Scroll Lock cancels; change the two `set` lines for other keys
# (`xev` shows a key's name and code). The press starts push-to-talk, the
# release stops it, Shift latches, and the second key cancels while
# recording. `xset -r` turns off auto-repeat for the key by its keycode (127
# is Pause), so a held Shift+Pause cannot end its own latch.
#
# set $spokenpad_talk Pause
# set $spokenpad_cancel Scroll_Lock
# bindsym $spokenpad_talk exec --no-startup-id spokenpad start
# bindsym --release $spokenpad_talk exec --no-startup-id spokenpad stop
# bindsym Shift+$spokenpad_talk exec --no-startup-id spokenpad toggle
# bindsym $spokenpad_cancel exec --no-startup-id spokenpad cancel
# exec_always --no-startup-id xset -r 127
