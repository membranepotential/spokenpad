# spokenpad — the dictation window in managed mode, on i3. Attach mode (the
# default) needs no window rules at all.
#
# scripts/install.sh does not install this. Copy or link it into a directory
# your i3 config includes, for example
#   mkdir -p ~/.config/i3/i3.d
#   ln -s <this file> ~/.config/i3/i3.d/spokenpad.conf
# with `include i3.d/*.conf` in ~/.config/i3/config (i3 4.20 or newer), then
# `i3-msg reload`.
#
# In managed mode (`[nvim] mode = "managed"`) the daemon runs its editor in
# the configured terminal, for example
#   alacritty --class spokenpad \
#     -o window.position.x=<x> -o window.position.y=<y> \
#     -e nvim --listen <socket> <file>
# Every terminal spokenpad supports is told to use the X11 instance
# "spokenpad" (`nvim.window_instance`), which is what these rules match.
#
# Only the two properties i3 alone can provide are set here. Position and size
# are not: spokenpad tells the terminal where to open (a third of the screen on
# each axis, top-left corner at the mouse pointer, so it appears beside
# whatever you are reading) and corrects the size itself once i3 reports the
# window. See nvim.window_fraction in the config.

# Float it. Without this it would tile and push your work aside — and i3 would
# ignore the position the terminal asks for, since that only applies to
# floating windows.
#
# spokenpad also asserts this itself when it sizes the window, because i3
# evaluates for_window at the moment it takes a window over, and a terminal
# that sets WM_CLASS late enough loses the match. This line is the first line
# of defence, not the only one.
for_window [instance="spokenpad"] floating enable

# Never take focus, at any point in its lifecycle: it appears while you are
# reading something else, and you keep reading. This is the window manager's
# job — spokenpad contains no focus call at all, because a dictation tool that
# moves focus is the exact failure it was written to replace.
#
# This one has no fallback. It is not expressible as a command, only as a
# rule, so spokenpad reads i3's loaded configuration over IPC and refuses to
# open a window unless it finds exactly this line. Keep it verbatim.
no_focus [instance="spokenpad"]
