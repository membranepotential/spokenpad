# spokenpad on sway: example key bindings. No window rule is needed: the
# pane (the default mode) asks sway over IPC not to focus it before each
# window, and attach mode opens no window.
#
# The package installs this as /usr/share/spokenpad/sway/spokenpad.conf and
# does not activate it. Copy the lines you want into your sway config, or
# `include` the file, then `swaymsg reload`.
#
# spokenpad reads no keyboard: these run the commands that control the daemon
# (README, "Bind your keys"). They are commented out because your config may
# bind these keys already. Pause talks and Scroll Lock cancels; change the
# two `set` lines for other keys (`wev` shows a key's name). The press starts
# push-to-talk, the release stops it, Shift latches, and the second key
# cancels while recording. --no-repeat keeps a held key from re-sending its
# command.
#
# set $spokenpad_talk Pause
# set $spokenpad_cancel Scroll_Lock
# bindsym --no-repeat $spokenpad_talk exec spokenpad start
# bindsym --release $spokenpad_talk exec spokenpad stop
# bindsym --no-repeat Shift+$spokenpad_talk exec spokenpad toggle
# bindsym --no-repeat $spokenpad_cancel exec spokenpad cancel
