# spokenpad on sway: example key bindings, and the rules for the dictation
# window in managed mode. Attach mode (the default) needs no window rules at
# all; every mode needs key bindings.
#
# scripts/install.sh does not install this. Paste the rule lines below into
# your MAIN sway config (~/.config/sway/config), then `swaymsg reload`. An
# `include` of this file does not count for the rules: see below. The key
# bindings work from anywhere.
#
# In managed mode (`[nvim] mode = "managed"`) the daemon runs its editor in
# the configured terminal and names the window "spokenpad"
# (`nvim.window_instance`): the Wayland app_id for a native window, and the
# X11 instance if the terminal ends up under Xwayland instead. A terminal
# picks between the two by itself, so both are covered here, and spokenpad
# checks for both.
#
# How spokenpad proves these rules: it reads the config sway actually loaded,
# over IPC. sway returns only the main config file's text, and spokenpad
# reads nothing from disk (a file on disk may never have been loaded), so the
# rules must be in the main file itself.

# Float it, so it does not tile and push your work aside. spokenpad also
# floats, sizes and places it itself once sway reports the window.
for_window [app_id="spokenpad"] floating enable
for_window [instance="spokenpad"] floating enable

# Never take focus when it opens. This is the window manager's job;
# spokenpad contains no focus call at all. Not expressible as a command, only
# as a rule, so spokenpad refuses to open a window unless it finds exactly
# these lines. Keep them verbatim.
#
# Note (sway(5), and i3 alike): no_focus does not apply to the first window
# on an empty workspace, so spokenpad does not open the window while the
# focused workspace is empty; the text goes to the pending passage instead.
no_focus [app_id="spokenpad"]
no_focus [instance="spokenpad"]

# ghostty names its native window "spokenpad.spokenpad", because a GTK
# application id needs a dot. Uncomment these if `[nvim] terminal = "ghostty"`.
# for_window [app_id="spokenpad.spokenpad"] floating enable
# no_focus [app_id="spokenpad.spokenpad"]

# Key bindings. spokenpad reads no keyboard: these run the commands that
# control the daemon (README, "Bind your keys"). They are commented out
# because your config may bind these keys already. The standard XKB layouts
# name F16 and F17 XF86Launch7 and XF86Launch8; `wev` shows any key's name.
# The press starts push-to-talk, the release stops it, Shift latches, and a
# second key cancels while recording. --no-repeat keeps a held key from
# re-sending its command.
#
# bindsym --no-repeat XF86Launch7 exec spokenpad start
# bindsym --release XF86Launch7 exec spokenpad stop
# bindsym --no-repeat Shift+XF86Launch7 exec spokenpad toggle
# bindsym --no-repeat XF86Launch8 exec spokenpad cancel
