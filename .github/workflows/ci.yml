# Correctness: fmt, clippy and every test.
#
# Runs in an Arch Linux container on purpose: spokenpad ships as an Arch
# package, and its tests drive the real programs it runs against -- nvim, a
# headless Xvfb with its own i3, Alacritty for the HiDPI comparison, the
# window managers the pane's focus is checked on (Openbox, sway and KWin,
# the last two headless with Xwayland), and systemd-socket-activate -- in
# the versions Arch ships.
#
# No SPOKENPAD_ALLOW_MISSING_* variable is set: a test whose tools are
# missing fails instead of skipping, so a skip can never pass for a pass.
# The tests that load the real models stay #[ignore]d; they need a 670 MB
# download and are run by hand.
#
# Every action is pinned to a commit, with its tag beside it: a tag can be
# moved, a commit cannot. The job only reads the repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # Before checkout: the container has no git, and actions/checkout without
      # git downloads a tarball with no .git.
      - name: Install the toolchain, the libraries and the programs the tests drive
        run: >-
          pacman -Syu --noconfirm --needed
          rust git portaudio neovim
          libxcb libxkbcommon-x11 fontconfig ttf-dejavu
          xorg-server-xvfb i3-wm xorg-setxkbmap xclip
          alacritty mesa
          openbox sway kwin kwin-x11 xorg-xwayland dbus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # sherpa-onnx-sys would download sherpa-onnx's and onnxruntime's
      # prebuilt libraries unchecked; this fetches the archive the PKGBUILD
      # pins and checks it against the same sha256, and the build copies it
      # from there.
      - name: Fetch the sherpa-onnx libraries, checked against the pinned sha256
        run: |
          packaging/sherpa-archive.sh "$RUNNER_TEMP/sherpa-onnx"
          echo "SHERPA_ONNX_ARCHIVE_DIR=$RUNNER_TEMP/sherpa-onnx" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A new key, so no cache from before the archive was checked is
          # reused: the build takes libraries it finds in
          # target/sherpa-onnx-prebuilt without looking at the archive.
          prefix-key: v1-sherpa-pinned
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
